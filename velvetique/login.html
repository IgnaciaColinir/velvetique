<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELVETIQUE | Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./Estilos/login.css" />
  </head>
  <body>
    <div class="register">
      <div class="header">
        <h2>VELVETIQUE</h2>
        <h3>Welcome Back</h3>
        <h4>BEAUTY BEGINS WITH YOU</h4>
        <p>Log in your account and continue</p>
        <p>your beauty journey with exclusive</p>
        <p>offers,new arrivals, and more.</p>
      </div>

      <div class="box">
        <h2>Log In</h2>
        <p>Enter your details to access your account.</p>
        <form class="register-form">
          <div>
            <div class="campo">
              <label> Email</label>
              <div class="i-input">
                <i class="bi bi-envelope"></i>
                <input type="text" placeholder="Enter your email" />
              </div>
            </div>
            <div class="campo">
              <label> Password</label>
              <div class="i-input">
                <i class="bi bi-lock"></i>
                <input type="text" placeholder="Enter your password" />
              </div>
            </div>
          </div>
        </form>
        <div class="terms">
          <div class="check">
          <input type="checkbox" />
          <p>Remember me</p>
          </div>
          <div>
            <button>Log In</button>
          </div>
        </div>
        <span>Don't have an account <a href="registro.html">Sign up</a>.</span>
      </div>
    </div>
  </body>
</html>
